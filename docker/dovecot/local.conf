# Test server settings (docker/dovecot/Dockerfile). Read after Debian's conf.d files.
protocols = imap
listen = *
log_path = /dev/stderr
auth_mechanisms = plain
disable_plaintext_auth = yes
ssl = required

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/home/vmail/%u
}
mail_location = maildir:~/Maildir

namespace inbox {
  separator = .
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
}
