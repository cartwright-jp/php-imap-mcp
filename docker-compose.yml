# Test mail servers for integration tests (never use in production).
# Start: docker compose up -d --wait   Stop: docker compose down
#
# Test account on both (login is the full address, as on XServer):
#   test@example.com / test-password
services:
  greenmail:
    image: greenmail/standalone:2.1.15
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=test:test-password@example.com
        -Dgreenmail.users.login=email
        -Dgreenmail.verbose
    ports:
      - "127.0.0.1:3025:3025" # SMTP (only used by tests to seed messages)
      - "127.0.0.1:3143:3143" # IMAP
      - "127.0.0.1:3993:3993" # IMAPS
  # Courier-IMAP, which XServer runs (docker/courier/Dockerfile). The integration tests must pass on both:
  #   IMAP_TEST_PORT=3994 composer test:integration
  courier:
    build: docker/courier
    ports:
      - "127.0.0.1:3994:993" # IMAPS
