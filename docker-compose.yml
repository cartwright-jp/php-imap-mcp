# Test mail servers for integration tests (never use in production). The integration tests must pass on both.
# Start: docker compose up -d --wait   Stop: docker compose down
#
# Test account on both (login is the full address, as on XServer):
#   test@example.com / test-password
services:
  # Courier-IMAP, which XServer runs: the main target (docker/courier/Dockerfile). The default port of the tests.
  #   composer test:integration
  courier:
    build: docker/courier
    ports:
      - "127.0.0.1:3993:993" # IMAPS
  # Dovecot, the most common IMAP server (docker/dovecot/Dockerfile):
  #   IMAP_TEST_PORT=3994 composer test:integration
  dovecot:
    build: docker/dovecot
    ports:
      - "127.0.0.1:3994:993" # IMAPS
