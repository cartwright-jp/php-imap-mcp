      - name: Integration tests on Dovecot
        if: success() || failure()
        run: composer test:integration
        env:
          IMAP_TEST_PORT: "3995"
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Coding style and PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: iconv, json, mbstring, openssl, sodium
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer cs
      - run: composer stan
      - name: E2E smoke tests (curl against the PHP built-in server)
        run: |
          token="$(php tests/e2e/make-config.php /tmp/php-imap-mcp-e2e)"
          PHP_IMAP_MCP_CONFIG=/tmp/php-imap-mcp-e2e/config.php php -S 127.0.0.1:18080 -t public public/index.php > /tmp/php-server.log 2>&1 &
          sleep 1
          MCP_TOKEN="$token" composer test:e2e
          bash tests/e2e/oauth-smoke.sh
          php bin/check-config.php /tmp/php-imap-mcp-e2e/config.php
      - if: failure()
        run: cat /tmp/php-server.log

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: iconv, json, mbstring, openssl, sodium
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test

  integration:
    name: Integration tests (GreenMail, Courier-IMAP, Dovecot)
    runs-on: ubuntu-latest
    env:
      IMAP_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: iconv, json, mbstring, openssl, sodium
          coverage: none
          tools: composer:v2
      - run: docker compose up -d --wait
      - run: bash tests/bin/wait-for-mail-server.sh
      - run: bash tests/bin/wait-for-mail-server.sh
        env:
          IMAP_TEST_PORT: "3994"
      - run: bash tests/bin/wait-for-mail-server.sh
        env:
          IMAP_TEST_PORT: "3995"
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Integration tests on GreenMail
        run: composer test:integration
      # XServer runs Courier-IMAP, which is stricter than GreenMail; Dovecot is the most common. All must pass.
      - name: Integration tests on Courier-IMAP
        if: success() || failure()
        run: composer test:integration
        env:
          IMAP_TEST_PORT: "3994"
      - name: Integration tests on Dovecot
        if: success() || failure()
        run: composer test:integration
        env:
          IMAP_TEST_PORT: "3995"
      - if: failure()
        run: docker compose logs
