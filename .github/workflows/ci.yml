name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Coding style and PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: iconv, json, mbstring, openssl
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer cs
      - run: composer stan

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: iconv, json, mbstring, openssl
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test

  integration:
    name: Integration tests (GreenMail)
    runs-on: ubuntu-latest
    env:
      IMAP_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: iconv, json, mbstring, openssl
          coverage: none
          tools: composer:v2
      - run: docker compose up -d --wait
      - run: bash tests/bin/wait-for-mail-server.sh
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test:integration
      - if: failure()
        run: docker compose logs
